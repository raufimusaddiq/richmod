name: family-finance

services:
  db:
    image: postgres:17.4-alpine
    command: ["postgres", "-c", "timezone=Asia/Jakarta"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Asia/Jakarta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infra/docker/migrate.Dockerfile
    environment:
      TZ: Asia/Jakarta
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    command: ["-dir", "/migrations", "postgres", "${DATABASE_URL:?set DATABASE_URL in .env}", "up"]
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      TZ: Asia/Jakarta
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      API_ADDR: ${API_ADDR:-:8080}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      LLM_GATEWAY_BASE_URL: ${LLM_GATEWAY_BASE_URL:-}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:-}
      LLM_GATEWAY_PROTOCOL: ${LLM_GATEWAY_PROTOCOL:-responses}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      GMAIL_OAUTH_CLIENT_PATH: ${GMAIL_OAUTH_CLIENT_PATH:-}
      GMAIL_MAILBOX: ${GMAIL_MAILBOX:-}
      GMAIL_TOKEN_ENCRYPTION_KEY: ${GMAIL_TOKEN_ENCRYPTION_KEY:-}
      GMAIL_PUBSUB_AUDIENCE: ${GMAIL_PUBSUB_AUDIENCE:-}
      GMAIL_PUBSUB_SERVICE_ACCOUNT: ${GMAIL_PUBSUB_SERVICE_ACCOUNT:-}
      DOCUMENT_STORAGE_PATH: ${DOCUMENT_STORAGE_PATH:-/var/lib/finance/attachments}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_REGION: ${OSS_REGION:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_PREFIX: ${OSS_PREFIX:-richmod}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:-}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:-}
    volumes:
      - attachment_data:/var/lib/finance/attachments
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    networks: [edge, internal]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      TZ: Asia/Jakarta
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      LLM_GATEWAY_BASE_URL: ${LLM_GATEWAY_BASE_URL:-}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:-}
      LLM_GATEWAY_PROTOCOL: ${LLM_GATEWAY_PROTOCOL:-responses}
      LLM_MODEL_TELEGRAM_EXTRACT: ${LLM_MODEL_TELEGRAM_EXTRACT:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      GMAIL_OAUTH_CLIENT_PATH: ${GMAIL_OAUTH_CLIENT_PATH:-}
      GMAIL_MAILBOX: ${GMAIL_MAILBOX:-}
      GMAIL_TOKEN_ENCRYPTION_KEY: ${GMAIL_TOKEN_ENCRYPTION_KEY:-}
      GMAIL_PUBSUB_TOPIC: ${GMAIL_PUBSUB_TOPIC:-}
      DOCUMENT_STORAGE_PATH: ${DOCUMENT_STORAGE_PATH:-/var/lib/finance/attachments}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_REGION: ${OSS_REGION:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_PREFIX: ${OSS_PREFIX:-richmod}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:-}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:-}
      LLM_MODEL_DOCUMENT_VISION: ${LLM_MODEL_DOCUMENT_VISION:-}
      LLM_MODEL_INSIGHTS: ${LLM_MODEL_INSIGHTS:-}
    volumes:
      - attachment_data:/var/lib/finance/attachments
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      TZ: Asia/Jakarta
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    networks: [edge]
    restart: unless-stopped

  backup:
    profiles: [operations]
    build:
      context: .
      dockerfile: infra/docker/backup.Dockerfile
    environment:
      TZ: Asia/Jakarta
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/repository}
      RESTIC_PASSWORD_FILE: ${RESTIC_PASSWORD_FILE:-/run/secrets/restic-password}
      AWS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY:-${BACKUP_S3_ACCESS_KEY_ID:-}}
      AWS_SECRET_ACCESS_KEY: ${OSS_SECRET_KEY:-${BACKUP_S3_SECRET_ACCESS_KEY:-}}
      AWS_DEFAULT_REGION: ${OSS_REGION:-${BACKUP_S3_REGION:-}}
    volumes:
      - backup_data:/repository
      - attachment_data:/var/lib/finance/attachments:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: "no"

networks:
  edge:
  internal:
    internal: true

volumes:
  postgres_data:
  attachment_data:
  backup_data:
