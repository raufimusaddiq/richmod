name: family-finance

services:
  db:
    image: postgres:17.4-alpine
    command: ["postgres", "-c", "timezone=Asia/Jakarta"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Asia/Jakarta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infra/docker/migrate.Dockerfile
    environment:
      TZ: Asia/Jakarta
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    command: ["-dir", "/migrations", "postgres", "${DATABASE_URL:?set DATABASE_URL in .env}", "up"]
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      TZ: Asia/Jakarta
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      API_ADDR: ${API_ADDR:-:8080}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      LLM_GATEWAY_BASE_URL: ${LLM_GATEWAY_BASE_URL:-}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    networks: [edge, internal]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      TZ: Asia/Jakarta
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      LLM_GATEWAY_BASE_URL: ${LLM_GATEWAY_BASE_URL:-}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      TZ: Asia/Jakarta
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    networks: [edge]
    restart: unless-stopped

networks:
  edge:
  internal:
    internal: true

volumes:
  postgres_data:
