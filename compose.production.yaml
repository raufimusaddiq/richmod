services:
  api:
    ports: !reset []
    environment:
      WEB_ORIGIN: https://finance.investdx.biz.id
      GMAIL_OAUTH_CLIENT_PATH: /run/secrets/google-oauth-client.json
    volumes:
      - /opt/family-finance/google-oauth-client.json:/run/secrets/google-oauth-client.json:ro
    networks:
      edge:
      internal:
      caddy_public:
        aliases: [finance-api]

  web:
    ports: !reset []
    networks:
      edge:
      caddy_public:
        aliases: [finance-web]

  worker:
    environment:
      GMAIL_OAUTH_CLIENT_PATH: /run/secrets/google-oauth-client.json
    volumes:
      - /opt/family-finance/google-oauth-client.json:/run/secrets/google-oauth-client.json:ro
    networks: [internal, caddy_public]

networks:
  caddy_public:
    external: true
    name: idx_default
