services:
  db:
    mem_limit: 1g
    pids_limit: 256

  migrate:
    mem_limit: 256m
    pids_limit: 128
    security_opt: [no-new-privileges:true]

  api:
    ports: !reset []
    deploy:
      replicas: 1
    environment:
      WEB_ORIGIN: https://finance.musaddiqr.com
    volumes:
    networks:
      internal:
      caddy_public:
        aliases: [finance-api]
    mem_limit: 768m
    pids_limit: 256
    security_opt: [no-new-privileges:true]

  worker:
    environment:
    volumes:
    networks: [internal, caddy_public]
    mem_limit: 1g
    pids_limit: 256
    security_opt: [no-new-privileges:true]

  backup:
    environment:
      RESTIC_REPOSITORY: s3:${BACKUP_S3_ENDPOINT:-${OSS_ENDPOINT:?set OSS_ENDPOINT in finance.env}}/${BACKUP_S3_BUCKET:-${OSS_BUCKET:?set OSS_BUCKET in finance.env}}/${BACKUP_S3_PREFIX:-${OSS_PREFIX:-richmod}}/backups/restic
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-${OSS_ACCESS_KEY:?set OSS_ACCESS_KEY in finance.env}}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-${OSS_SECRET_KEY:?set OSS_SECRET_KEY in finance.env}}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-${OSS_REGION:?set OSS_REGION in finance.env}}
    volumes:
      - /opt/family-finance/restic-password:/run/secrets/restic-password:ro
      - backup_data:/repository
      - attachment_data:/var/lib/finance/attachments:ro
    networks: [internal, caddy_public]
    mem_limit: 512m
    pids_limit: 256
    security_opt: [no-new-privileges:true]

networks:
  caddy_public:
    external: true
    name: idx_default
