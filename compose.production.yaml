services:
  db:
    mem_limit: 1g
    pids_limit: 256

  migrate:
    mem_limit: 256m
    pids_limit: 128
    security_opt: [no-new-privileges:true]

  api:
    ports: !reset []
    environment:
      WEB_ORIGIN: https://finance.investdx.biz.id
    volumes:
    networks:
      edge:
      internal:
      caddy_public:
        aliases: [finance-api]
    mem_limit: 768m
    pids_limit: 256
    security_opt: [no-new-privileges:true]

  web:
    ports: !reset []
    networks:
      edge:
      caddy_public:
        aliases: [finance-web]
    mem_limit: 512m
    pids_limit: 256
    security_opt: [no-new-privileges:true]

  worker:
    environment:
    volumes:
    networks: [internal, caddy_public]
    mem_limit: 1g
    pids_limit: 256
    security_opt: [no-new-privileges:true]

  backup:
    environment:
      RESTIC_REPOSITORY: s3:${OSS_ENDPOINT:?set OSS_ENDPOINT in finance.env}/${OSS_BUCKET:?set OSS_BUCKET in finance.env}/${OSS_PREFIX:-richmod}/backups/restic
      AWS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY:?set OSS_ACCESS_KEY in finance.env}
      AWS_SECRET_ACCESS_KEY: ${OSS_SECRET_KEY:?set OSS_SECRET_KEY in finance.env}
      AWS_DEFAULT_REGION: ${OSS_REGION:?set OSS_REGION in finance.env}
    volumes:
      - /opt/family-finance/restic-password:/run/secrets/restic-password:ro
      - backup_data:/repository
      - attachment_data:/var/lib/finance/attachments:ro
    networks: [internal, caddy_public]
    mem_limit: 512m
    pids_limit: 256
    security_opt: [no-new-privileges:true]

networks:
  caddy_public:
    external: true
    name: idx_default
