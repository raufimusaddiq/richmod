services:
  api:
    ports: !reset []
    environment:
      WEB_ORIGIN: https://finance.investdx.biz.id
    networks:
      edge:
      internal:
      caddy_public:
        aliases: [finance-api]

  web:
    ports: !reset []
    networks:
      edge:
      caddy_public:
        aliases: [finance-web]

  worker:
    networks: [internal, caddy_public]

networks:
  caddy_public:
    external: true
    name: idx_default
