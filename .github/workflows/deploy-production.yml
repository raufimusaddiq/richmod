name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Verified main commit SHA to deploy (full 40-char SHA)
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  # Format + equality with main must run outside the `production` environment:
  # environment protection approval gates any step in the deploy job, so a check
  # there cannot stop a bad or wrong SHA from consuming a human approval. This
  # preflight job needs no secrets and no environment; `deploy` depends on it.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Validate sha input
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          # A short SHA is not rejected by workflow_dispatch, and checkout treats
          # it as a ref name, so it fails late with a confusing "branch or tag ...
          # could not be found" and would build the wrong sha-<short> image tag.
          if ! printf '%s' "$INPUT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "sha must be a full 40-character lowercase hex commit SHA (got: '$INPUT_SHA')" >&2
            exit 1
          fi
          # A well-formed but wrong 40-hex sha (a typo) passes the format check and
          # then dies at checkout with "upload-pack: not our ref". Deploy only ever
          # ships main, so assert equality here, before the approval gate.
          git fetch --no-tags origin main
          main=$(git rev-parse origin/main)
          if [ "$INPUT_SHA" != "$main" ]; then
            echo "sha must be the current main commit (got: '$INPUT_SHA', main: '$main')" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$INPUT_SHA" origin/main

  deploy:
    environment: production
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PROD_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Pull immutable images and deploy
        env:
          GHCR_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /home/ubuntu/richmod && RICHMOD_GIT_SHA='${{ inputs.sha }}' RICHMOD_IMAGE_TAG='sha-${{ inputs.sha }}' RICHMOD_IMAGE_REGISTRY='ghcr.io/${{ github.repository_owner }}' GHCR_USERNAME='x-access-token' ./infra/deploy/release.sh"
