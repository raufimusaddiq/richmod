name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Verified main commit SHA to deploy (full 40-char SHA)
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      # A short SHA is not rejected by workflow_dispatch, and actions/checkout
      # treats it as a ref name, so the run fails late with a confusing
      # "branch or tag ... could not be found". It would also build the wrong
      # immutable tag (sha-<short>). Fail fast with the actual requirement
      # instead of spending a human production approval on it.
      #
      # A well-formed but wrong 40-hex SHA (e.g. a typo) also passes the format
      # check, then dies at checkout with "upload-pack: not our ref". Deploy must
      # ship main anyway, so compare against main here and fail before the human
      # production approval is consumed.
      - name: Validate sha input
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if ! printf '%s' "$INPUT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "sha must be a full 40-character lowercase hex commit SHA (got: '$INPUT_SHA')" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          main=$(git rev-parse origin/main)
          if [ "$INPUT_SHA" != "$main" ]; then
            echo "sha must be the current main commit (got: '$INPUT_SHA', main: '$main')" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Verify release is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${{ inputs.sha }}" origin/main
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PROD_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Pull immutable images and deploy
        env:
          GHCR_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /home/ubuntu/richmod && RICHMOD_GIT_SHA='${{ inputs.sha }}' RICHMOD_IMAGE_TAG='sha-${{ inputs.sha }}' RICHMOD_IMAGE_REGISTRY='ghcr.io/${{ github.repository_owner }}' GHCR_USERNAME='x-access-token' ./infra/deploy/release.sh"
