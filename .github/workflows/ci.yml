name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      containers: ${{ steps.filter.outputs.containers }}
      images: ${{ steps.images.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            workflow: &workflow
              - .github/workflows/ci.yml
            backend:
              - *workflow
              - apps/api/**
              - apps/worker/**
              - apps/reviewdomain/**
              - db/**
              - go.work
              - go.work.sum
              - scripts/check_native_only_llm.sh
              - compose.yaml
              - docs/runbooks/stuck-source-events.md
            web:
              - *workflow
              - apps/web/**
              - apps/api/internal/webui/**
              - apps/worker/internal/document/processor.go
              - db/migrations/**
              - docs/brand-guidelines.md
            containers:
              - *workflow
              - compose.yaml
              - compose.production.yaml
              - .env.example
              - infra/**
            image-api:
              - *workflow
              - .dockerignore
              - infra/docker/api.Dockerfile
              - apps/api/**
              - apps/reviewdomain/**
              - apps/web/**
            image-worker:
              - *workflow
              - .dockerignore
              - infra/docker/worker.Dockerfile
              - apps/worker/**
              - apps/reviewdomain/**
            image-migrate:
              - *workflow
              - .dockerignore
              - infra/docker/migrate.Dockerfile
              - db/migrations/**
            image-backup:
              - *workflow
              - .dockerignore
              - infra/docker/backup.Dockerfile
              - infra/backup/backup.sh
              - infra/backup/restore-drill.sh
      - id: images
        env:
          MATCHED: ${{ steps.filter.outputs.changes }}
        run: echo "matrix=$(jq -c '[.[] | select(startswith("image-")) | ltrimstr("image-")]' <<<"$MATCHED")" >> "$GITHUB_OUTPUT"

  comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.14.0
      - name: Test the comment scanner
        run: node --test scripts/check-comments.test.mjs
      - name: Enforce the no-comments ratchet
        run: node scripts/check-comments.mjs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-guards:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reject multi-command prepared SQL
        run: |
          if git grep -nE ';[[:space:]]*(UPDATE|INSERT|DELETE|SELECT)' -- ':(glob)apps/api/**/*.go' ':(glob)apps/worker/**/*.go'; then
            echo 'Split SQL commands into separate transaction-scoped Exec calls.' >&2
            exit 1
          fi
      - name: Enforce native-only LLM access
        run: scripts/check_native_only_llm.sh

  backend:
    name: backend (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [api, worker, reviewdomain]
    defaults:
      run:
        working-directory: apps/${{ matrix.module }}
    env:
      TEST_DATABASE_URL: postgres://family_finance_test:test-only-password@localhost:5432/family_finance_test?sslmode=disable
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_DB: family_finance_test
          POSTGRES_USER: family_finance_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U family_finance_test -d family_finance_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: 1.27.0
          cache-dependency-path: |
            apps/${{ matrix.module }}/go.sum
            apps/reviewdomain/go.sum
      - name: Migrate integration database
        working-directory: ${{ github.workspace }}
        env:
          GOOSE_VERSION: v3.24.1
          GOOSE_LINUX_X86_64_SHA256: 313ba1c77a367f431faf690fe817aad297722623b62395a8ac64281f54f6c415
        run: |
          curl -fsSL -o "$RUNNER_TEMP/goose" "https://github.com/pressly/goose/releases/download/$GOOSE_VERSION/goose_linux_x86_64"
          echo "$GOOSE_LINUX_X86_64_SHA256  $RUNNER_TEMP/goose" | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/goose" /usr/local/bin/goose
          goose -dir db/migrations postgres "$TEST_DATABASE_URL" up
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  web-unit:
    name: web (unit)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.14.0
      - name: Install unzip for setup-bun
        run: command -v unzip >/dev/null || (apt-get update -qq && apt-get install -y -qq unzip)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build
        run: bun run build
      - name: Unit tests
        run: bun run test

  web-browser:
    name: web (browser ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.14.0
      - name: Install unzip for setup-bun
        run: command -v unzip >/dev/null || (apt-get update -qq && apt-get install -y -qq unzip)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build
        run: bun run build
      - name: Browser tests
        run: bunx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload blob report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/web/blob-report
          if-no-files-found: ignore

  web-report:
    name: web (report)
    needs: [changes, web-browser]
    if: ${{ always() && needs.web-browser.result == 'failure' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.14.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: blob-report-*
          path: apps/web/all-blob-reports
          merge-multiple: true
      - name: Merge shard reports
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: bunx playwright merge-reports --reporter=html all-blob-reports
      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report
          path: apps/web/playwright-report

  web:
    needs: [changes, web-unit, web-browser]
    if: ${{ always() && needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every web job to pass
        env:
          UNIT: ${{ needs.web-unit.result }}
          BROWSER: ${{ needs.web-browser.result }}
        run: |
          echo "unit=$UNIT browser=$BROWSER"
          [ "$UNIT" = success ] && [ "$BROWSER" = success ]

  containers:
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate Compose
        env:
          POSTGRES_DB: family_finance
          POSTGRES_USER: family_finance
          POSTGRES_PASSWORD: ci-only-password
          DATABASE_URL: postgres://family_finance:ci-only-password@db:5432/family_finance?sslmode=disable
        run: docker compose config --quiet
      - name: Test local API egress
        run: sh infra/compose/compose_network_test.sh
      - name: Test deployment image retention
        run: sh infra/deploy/post-deploy_test.sh
      - name: Test backup repository bootstrap
        run: sh infra/backup/backup_test.sh

  images:
    name: images (${{ matrix.image }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
