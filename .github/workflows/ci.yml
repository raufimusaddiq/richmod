name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_DB: family_finance_test
          POSTGRES_USER: family_finance_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U family_finance_test -d family_finance_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.1
          cache-dependency-path: |
            apps/api/go.sum
            apps/worker/go.sum
      - name: Migrate integration database
        env:
          TEST_DATABASE_URL: postgres://family_finance_test:test-only-password@localhost:5432/family_finance_test?sslmode=disable
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
          goose -dir db/migrations postgres "$TEST_DATABASE_URL" up
      - name: Test API
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgres://family_finance_test:test-only-password@localhost:5432/family_finance_test?sslmode=disable
        run: go test ./...
      - name: Test worker
        working-directory: apps/worker
        run: go test ./...
      - name: Vet API
        working-directory: apps/api
        run: go vet ./...
      - name: Vet worker
        working-directory: apps/worker
        run: go vet ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build web
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        env:
          POSTGRES_DB: family_finance
          POSTGRES_USER: family_finance
          POSTGRES_PASSWORD: ci-only-password
          DATABASE_URL: postgres://family_finance:ci-only-password@db:5432/family_finance?sslmode=disable
          SESSION_SECRET: 12345678901234567890123456789012
        run: docker compose config --quiet
      - name: Build production images
        run: |
          docker build -f infra/docker/api.Dockerfile -t family-finance-api:ci .
          docker build -f infra/docker/worker.Dockerfile -t family-finance-worker:ci .
          docker build -f infra/docker/migrate.Dockerfile -t family-finance-migrate:ci .
          docker build -f infra/docker/web.Dockerfile -t family-finance-web:ci .
          docker build -f infra/docker/backup.Dockerfile -t family-finance-backup:ci .
