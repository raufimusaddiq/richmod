name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_DB: family_finance_test
          POSTGRES_USER: family_finance_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U family_finance_test -d family_finance_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.0
          cache-dependency-path: |
            apps/api/go.sum
            apps/worker/go.sum
            apps/reviewdomain/go.sum
      - name: Migrate integration database
        env:
          TEST_DATABASE_URL: postgres://family_finance_test:test-only-password@localhost:5432/family_finance_test?sslmode=disable
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
          goose -dir db/migrations postgres "$TEST_DATABASE_URL" up
      - name: Install CI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version
      - name: Reject multi-command prepared SQL
        run: |
          command -v rg >/dev/null 2>&1 || { echo 'ripgrep is required for SQL guard' >&2; exit 1; }
          if rg -n ';[[:space:]]*(UPDATE|INSERT|DELETE|SELECT)' apps/api apps/worker -g '*.go'; then
            echo 'Split SQL commands into separate transaction-scoped Exec calls.' >&2
            exit 1
          fi
      - name: Enforce native-only LLM access
        run: scripts/check_native_only_llm.sh
      - name: Test API
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgres://family_finance_test:test-only-password@localhost:5432/family_finance_test?sslmode=disable
        run: go test ./...
      - name: Test shared finance domain
        working-directory: apps/reviewdomain
        env:
          TEST_DATABASE_URL: postgres://family_finance_test:test-only-password@localhost:5432/family_finance_test?sslmode=disable
        run: go test ./...
      - name: Test worker
        working-directory: apps/worker
        env:
          TEST_DATABASE_URL: postgres://family_finance_test:test-only-password@localhost:5432/family_finance_test?sslmode=disable
        run: go test -v ./...
      - name: Vet API
        working-directory: apps/api
        run: go vet ./...
      - name: Vet shared finance domain
        working-directory: apps/reviewdomain
        run: go vet ./...
      - name: Vet worker
        working-directory: apps/worker
        run: go vet ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build web
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Test web
        working-directory: apps/web
        run: npm test

  # Each leg rebuilds the static export it serves: a shared artifact would need
  # `needs: frontend` and serialise the smokes behind the build, which costs more
  # than a parallel `next build`.
  frontend-smoke:
    name: frontend-smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: transaction-date
            script: scripts/transaction-date-smoke.mjs
            artifact: transaction-date-screenshots
            results: apps/web/test-results/transaction-date
          - name: analytics-review
            script: scripts/analytics-review-smoke.mjs
            artifact: cycle-review-screenshots
            results: apps/web/test-results/cycle-review
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build web
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Resolve Playwright version
        working-directory: apps/web
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: npx playwright install chromium webkit
      # OS libraries are not part of the browser cache, so always install them.
      - name: Install Playwright OS dependencies
        working-directory: apps/web
        run: npx playwright install-deps chromium webkit
      - name: Run synthetic ${{ matrix.name }} smoke
        working-directory: apps/web
        run: node ${{ matrix.script }}
      - name: Upload ${{ matrix.name }} screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.results }}
          if-no-files-found: ignore

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose
        env:
          POSTGRES_DB: family_finance
          POSTGRES_USER: family_finance
          POSTGRES_PASSWORD: ci-only-password
          DATABASE_URL: postgres://family_finance:ci-only-password@db:5432/family_finance?sslmode=disable
          SESSION_SECRET: 12345678901234567890123456789012
        run: docker compose config --quiet
      - name: Test local API egress
        run: sh infra/compose/compose_network_test.sh
      - name: Test deployment image retention
        run: sh infra/deploy/post-deploy_test.sh
      - name: Test backup repository bootstrap
        run: sh infra/backup/backup_test.sh

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, migrate, backup]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # No push/load: the build itself is the check; nothing downstream consumes
      # these images (release-images.yml publishes the real ones).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
