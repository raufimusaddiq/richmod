name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      containers: ${{ steps.filter.outputs.containers }}
      images: ${{ steps.images.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            workflow: &workflow
              - .github/workflows/ci.yml
            backend:
              - *workflow
              - apps/api/**
              - apps/worker/**
              - apps/reviewdomain/**
              - db/**
              - go.work
              - go.work.sum
              - scripts/check_native_only_llm.sh
              - compose.yaml
              - docs/runbooks/stuck-source-events.md
            web:
              - *workflow
              - apps/web/**
              - apps/api/internal/webui/**
              - apps/worker/internal/document/processor.go
              - db/migrations/**
              - docs/brand-guidelines.md
            containers:
              - *workflow
              - compose.yaml
              - compose.production.yaml
              - .env.example
              - infra/**
            image-api:
              - *workflow
              - .dockerignore
              - infra/docker/api.Dockerfile
              - apps/api/**
              - apps/reviewdomain/**
              - apps/web/**
            image-worker:
              - *workflow
              - .dockerignore
              - infra/docker/worker.Dockerfile
              - apps/worker/**
              - apps/reviewdomain/**
            image-migrate:
              - *workflow
              - .dockerignore
              - infra/docker/migrate.Dockerfile
              - db/migrations/**
            image-backup:
              - *workflow
              - .dockerignore
              - infra/docker/backup.Dockerfile
              - infra/backup/backup.sh
              - infra/backup/restore-drill.sh
      - id: images
        env:
          MATCHED: ${{ steps.filter.outputs.changes }}
        run: echo "matrix=$(jq -c '[.[] | select(startswith("image-")) | ltrimstr("image-")]' <<<"$MATCHED")" >> "$GITHUB_OUTPUT"

  comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
      - name: Test the comment scanner
        run: node --test scripts/check-comments.test.mjs
      - name: Enforce the no-comments ratchet
        run: node scripts/check-comments.mjs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-guards:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject multi-command prepared SQL
        run: |
          if git grep -nE ';[[:space:]]*(UPDATE|INSERT|DELETE|SELECT)' -- ':(glob)apps/api/**/*.go' ':(glob)apps/worker/**/*.go'; then
            echo 'Split SQL commands into separate transaction-scoped Exec calls.' >&2
            exit 1
          fi
      - name: Enforce native-only LLM access
        run: scripts/check_native_only_llm.sh

  backend:
    name: backend (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [api, worker, reviewdomain]
    defaults:
      run:
        working-directory: apps/${{ matrix.module }}
    env:
      TEST_DATABASE_URL: postgres://family_finance_test:test-only-password@localhost:5432/family_finance_test?sslmode=disable
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_DB: family_finance_test
          POSTGRES_USER: family_finance_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U family_finance_test -d family_finance_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.0
          cache-dependency-path: |
            apps/${{ matrix.module }}/go.sum
            apps/reviewdomain/go.sum
      - name: Migrate integration database
        working-directory: ${{ github.workspace }}
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
          goose -dir db/migrations postgres "$TEST_DATABASE_URL" up
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        id: build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Playwright smokes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p test-results/logs
          pids=""
          for name in transaction-date analytics-review mobile-layout; do
            node scripts/$name-smoke.mjs >test-results/logs/$name.log 2>&1 &
            pids="$pids $name:$!"
          done
          status=0
          for entry in $pids; do
            name=${entry%%:*}
            wait "${entry##*:}" || { status=1; echo "::error::$name smoke failed"; }
            echo "::group::$name smoke"
            cat "test-results/logs/$name.log"
            echo "::endgroup::"
          done
          exit $status
      - name: Upload smoke screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: apps/web/test-results
          if-no-files-found: ignore

  containers:
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose
        env:
          POSTGRES_DB: family_finance
          POSTGRES_USER: family_finance
          POSTGRES_PASSWORD: ci-only-password
          DATABASE_URL: postgres://family_finance:ci-only-password@db:5432/family_finance?sslmode=disable
          SESSION_SECRET: 12345678901234567890123456789012
        run: docker compose config --quiet
      - name: Test local API egress
        run: sh infra/compose/compose_network_test.sh
      - name: Test deployment image retention
        run: sh infra/deploy/post-deploy_test.sh
      - name: Test backup repository bootstrap
        run: sh infra/backup/backup_test.sh

  images:
    name: images (${{ matrix.image }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
