name: Release Images

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or main to build
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
          fetch-depth: 0
      - id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          tags: ghcr.io/${{ github.repository_owner }}/richmod-api:sha-${{ steps.release.outputs.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: true
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
          tags: ghcr.io/${{ github.repository_owner }}/richmod-worker:sha-${{ steps.release.outputs.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: infra/docker/migrate.Dockerfile
          push: true
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max
          tags: ghcr.io/${{ github.repository_owner }}/richmod-migrate:sha-${{ steps.release.outputs.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
